name: Veille Adobe Commerce / Magento

on:
  schedule:
    # Tous les jours à 07:00 UTC (adaptez à votre fuseau horaire)
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour committer le fichier state.json

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent de veille
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      - name: Sauvegarder l'état (state.json + latest_digest.json)
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json latest_digest.json
          git diff --quiet --cached || git commit -m "Mise à jour de l'état de veille [skip ci]"
          git push
